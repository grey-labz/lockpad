name: Deploy Lockpad
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify deployed contracts and build testnet app
        run: npm run release:build
        env:
          VITE_NETWORK: testnet
          VITE_TOKEN_ACCOUNT: ${{ vars.VITE_TOKEN_ACCOUNT }}
          VITE_VAULT_ACCOUNT: ${{ vars.VITE_VAULT_ACCOUNT }}
          VITE_MARKET_ACCOUNT: ${{ vars.VITE_MARKET_ACCOUNT }}
          VITE_NEAR_RPC: ${{ vars.VITE_NEAR_RPC }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
